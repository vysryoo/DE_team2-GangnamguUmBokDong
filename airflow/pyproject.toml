[project]
name = "airflow"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "apache-airflow[postgres]>=3.0,<4",
    "apache-airflow-providers-standard",
    "apache-airflow-providers-fab>=3.8.0",
    "boto3==1.43.69",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
